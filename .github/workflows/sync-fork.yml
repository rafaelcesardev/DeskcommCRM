name: Sincronizar main do fork

on:
  schedule:
    - cron: "17 */1 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  sync:
    # só roda no fork, nunca no repositório original
    if: github.repository == 'rafaelcesardev/DeskcommCRM'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # O token precisa de Contents e Workflows em leitura e escrita para trazer os workflows do original.
      - name: Sincronizar main com o repositório original
        run: |
          : "${GH_TOKEN:?Configure o secret SYNC_FORK_TOKEN no fork.}"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/merge-upstream" -f branch=main
        env:
          GH_TOKEN: ${{ secrets.SYNC_FORK_TOKEN }}
